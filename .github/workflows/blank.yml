name: Configure RDP access with Tailscale on Windows 11 ARM64

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    name: Windows 11 ARM64 - Virtual PC
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. INFORMACOES INICIAIS
      # ============================================================

      - name: Initial information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             WINDOWS 11 ARM64 VIRTUAL PC"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "User: Rafael"
          Write-Host "RDP Port: 3389"
          Write-Host "Password: TAILSCALE_AUTH_KEY"
          Write-Host ""
          Write-Host "The real secret value will NOT be displayed."
          Write-Host ""
          Write-Host "Tailscale IP will be detected automatically."
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. CONFIGURE VARIABLES
      # ============================================================

      - name: Configure variables
        shell: powershell
        run: |
          "RDP_USERNAME=Rafael" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RDP_PORT=3389" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAILSCALE_VERSION=1.102.4" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host ""
          Write-Host "Variables configured."
          Write-Host ""

      # ============================================================
      # 4. VALIDATE ONLY SECRET
      # ============================================================

      - name: Validate Tailscale secret
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             VALIDATING TAILSCALE SECRET"
          Write-Host "============================================================"
          Write-Host ""

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              Write-Host "ERROR: TAILSCALE_AUTH_KEY is not configured."
              Write-Host ""
              Write-Host "Create this repository secret:"
              Write-Host "TAILSCALE_AUTH_KEY"
              Write-Host ""
              exit 1
          }

          Write-Host "TAILSCALE_AUTH_KEY is configured."
          Write-Host "The secret value will not be displayed."
          Write-Host ""

      # ============================================================
      # 5. CREATE / UPDATE RAFAEL USER
      # ============================================================

      - name: Create Rafael Windows user
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                CREATING RAFAEL USER"
          Write-Host "============================================================"
          Write-Host ""

          $username = "Rafael"

          $securePassword = ConvertTo-SecureString $env:TAILSCALE_AUTH_KEY -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {
              Write-Host "Creating user Rafael..."

              New-LocalUser `
                  -Name $username `
                  -Password $securePassword `
                  -FullName "Rafael" `
                  -Description "RDP user" `
                  -PasswordNeverExpires:$true `
                  -UserMayNotChangePassword:$false

              Write-Host "User Rafael created."
          }
          else {
              Write-Host "User Rafael already exists."
              Write-Host "Updating password..."

              Set-LocalUser -Name $username -Password $securePassword

              Write-Host "Password updated."
          }

          Enable-LocalUser -Name $username

          Write-Host ""
          Write-Host "Adding Rafael to Administrators..."

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Adding Rafael to Remote Desktop Users..."

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Rafael user configuration completed."
          Write-Host ""
          Write-Host "IMPORTANT:"
          Write-Host "The TAILSCALE_AUTH_KEY value was NOT printed."
          Write-Host ""

      # ============================================================
      # 6. ENABLE RDP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 ENABLING REMOTE DESKTOP"
          Write-Host "============================================================"
          Write-Host ""

          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1

          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."
          Write-Host "NLA authentication enabled."
          Write-Host "Remote Desktop service configured."
          Write-Host ""

      # ============================================================
      # 7. CONFIGURE RDP FIREWALL
      # ============================================================

      - name: Configure RDP firewall
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 CONFIGURING RDP FIREWALL"
          Write-Host "============================================================"
          Write-Host ""

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
              Enable-NetFirewallRule -ErrorAction SilentlyContinue

          New-NetFirewallRule `
              -DisplayName "RDP TCP 3389" `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any `
              -ErrorAction SilentlyContinue

          Write-Host "RDP firewall configured."
          Write-Host ""

      # ============================================================
      # 8. MAKE RAFAEL VISIBLE ON WINDOWS LOGIN
      # ============================================================

      - name: Configure Windows login visibility
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             CONFIGURING WINDOWS LOGIN"
          Write-Host "============================================================"
          Write-Host ""

          $registryPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList"

          if (-not (Test-Path $registryPath)) {
              New-Item -Path $registryPath -Force | Out-Null
          }

          New-ItemProperty -Path $registryPath -Name "Rafael" -PropertyType DWord -Value 1 -Force | Out-Null

          Write-Host "Rafael configured for Windows login."
          Write-Host ""

      # ============================================================
      # 9. DOWNLOAD TAILSCALE
      # ============================================================

      - name: Download Tailscale ARM64
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 DOWNLOADING TAILSCALE"
          Write-Host "============================================================"
          Write-Host ""

          $version = $env:TAILSCALE_VERSION
          $installerUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-$version-arm64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale-setup-arm64.msi"

          Write-Host "Tailscale version: $version"
          Write-Host ""
          Write-Host "Downloading installer..."
          Write-Host $installerUrl

          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              Write-Host ""
              Write-Host "ERROR: Tailscale installer was not downloaded."
              exit 1
          }

          Write-Host "Download completed."
          Write-Host ""

      # ============================================================
      # 10. INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  INSTALLING TAILSCALE"
          Write-Host "============================================================"
          Write-Host ""

          $installerPath = Join-Path $env:TEMP "tailscale-setup-arm64.msi"

          $arguments = @(
              "/i"
              "`"$installerPath`""
              "/qn"
              "/norestart"
          )

          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $arguments -Wait -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          if (($process.ExitCode -ne 0) -and ($process.ExitCode -ne 3010)) {
              Write-Host ""
              Write-Host "ERROR: Tailscale installation failed."
              exit $process.ExitCode
          }

          Write-Host ""
          Write-Host "Tailscale installation completed."
          Write-Host ""

      # ============================================================
      # 11. FIND TAILSCALE.EXE
      # ============================================================

      - name: Find Tailscale executable
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                FINDING TAILSCALE.EXE"
          Write-Host "============================================================"
          Write-Host ""

          $possiblePaths = @(
              "C:\Program Files\Tailscale\tailscale.exe",
              "C:\Program Files (x86)\Tailscale\tailscale.exe",
              (Join-Path $env:ProgramFiles "Tailscale\tailscale.exe")
          )

          $tailscalePath = $null

          foreach ($candidate in $possiblePaths) {
              if (Test-Path -LiteralPath $candidate) {
                  $tailscalePath = $candidate
                  break
              }
          }

          if ([string]::IsNullOrWhiteSpace($tailscalePath)) {
              $command = Get-Command "tailscale.exe" -ErrorAction SilentlyContinue
              if ($null -ne $command) {
                  $tailscalePath = $command.Source
              }
          }

          if ([string]::IsNullOrWhiteSpace($tailscalePath)) {
              Write-Host ""
              Write-Host "ERROR: tailscale.exe was not found."
              exit 1
          }

          "TAILSCALE_EXE=$tailscalePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale executable found."
          Write-Host $tailscalePath
          Write-Host ""

      # ============================================================
      # 12. START TAILSCALE SERVICE
      # ============================================================

      - name: Start Tailscale service
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 STARTING TAILSCALE"
          Write-Host "============================================================"
          Write-Host ""

          $service = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          if ($null -eq $service) {
              Write-Host "ERROR: Tailscale service was not found."
              exit 1
          }

          Set-Service -Name "Tailscale" -StartupType Automatic

          if ($service.Status -ne "Running") {
              Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          }

          Write-Host "Waiting for Tailscale service..."

          $serviceReady = $false

          for ($attempt = 1; $attempt -le 60; $attempt++) {
              $currentService = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

              if ($null -ne $currentService) {
                  if ($currentService.Status -eq "Running") {
                      $serviceReady = $true
                      break
                  }
              }

              Write-Host "Waiting... attempt $attempt/60"
              Start-Sleep -Seconds 2
          }

          if (-not $serviceReady) {
              Write-Host ""
              Write-Host "ERROR: Tailscale service did not start."
              exit 1
          }

          Write-Host ""
          Write-Host "Tailscale service is running."
          Write-Host ""

      # ============================================================
      # 13. AUTHENTICATE TAILSCALE
      # ============================================================

      - name: Authenticate Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              AUTHENTICATING TAILSCALE"
          Write-Host "============================================================"
          Write-Host ""

          $tailscale = $env:TAILSCALE_EXE

          if ([string]::IsNullOrWhiteSpace($tailscale)) {
              Write-Host "ERROR: TAILSCALE_EXE is empty."
              exit 1
          }

          if (-not (Test-Path -LiteralPath $tailscale)) {
              Write-Host "ERROR: Tailscale executable does not exist."
              exit 1
          }

          Write-Host "Starting Tailscale authentication..."
          Write-Host "The authentication key will not be displayed."

          $hostname = "gha-win11-arm64-$env:GITHUB_RUN_ID"

          & $tailscale up --auth-key=$env:TAILSCALE_AUTH_KEY --unattended --accept-dns --accept-routes --hostname=$hostname
          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Tailscale command exit code: $exitCode"

          if ($exitCode -ne 0) {
              Write-Host ""
              Write-Host "Tailscale returned a non-zero exit code."
              Write-Host "The secret value was not displayed."
              exit $exitCode
          }

          Write-Host ""
          Write-Host "Tailscale authentication command completed."
          Write-Host ""

      # ============================================================
      # 14. WAIT FOR TAILSCALE NETWORK
      # ============================================================

      - name: Wait for Tailscale network
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             WAITING FOR TAILSCALE NETWORK"
          Write-Host "============================================================"
          Write-Host ""

          $tailscale = $env:TAILSCALE_EXE

          if ([string]::IsNullOrWhiteSpace($tailscale)) {
              Write-Host "ERROR: TAILSCALE_EXE is not configured."
              exit 1
          }

          if (-not (Test-Path -LiteralPath $tailscale)) {
              Write-Host "ERROR: Tailscale executable does not exist."
              exit 1
          }

          $ready = $false
          $tailscaleIp = ""

          for ($attempt = 1; $attempt -le 90; $attempt++) {
              Write-Host "Checking Tailscale... attempt $attempt/90"

              $statusText = ""
              try {
                  $statusText = & $tailscale status 2>&1 | Out-String
              }
              catch {
                  $statusText = $_.Exception.Message
              }

              $ipText = ""
              try {
                  $ipText = & $tailscale ip -4 2>$null | Select-Object -First 1
              }
              catch {
                  $ipText = ""
              }

              if (-not [string]::IsNullOrWhiteSpace($ipText)) {
                  $ipText = $ipText.ToString().Trim()
              }

              if ($ipText -match '^\d{1,3}(\.\d{1,3}){3}$') {
                  $tailscaleIp = $ipText
                  $ready = $true
                  Write-Host "Tailscale IPv4 detected: $tailscaleIp"
                  break
              }

              Start-Sleep -Seconds 2
          }

          if (-not $ready) {
              Write-Host ""
              Write-Host "ERROR: Tailscale network did not become ready."
              try {
                  & $tailscale status
              }
              catch {
                  Write-Host "Unable to print tailscale status."
              }
              exit 1
          }

          "TAILSCALE_IP=$tailscaleIp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host ""
          Write-Host "Tailscale network is ready."
          Write-Host ""

      # ============================================================
      # 15. SHOW CONNECTION INFO
      # ============================================================

      - name: Show connection information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 RDP CONNECTION INFO"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Computer / Tailscale IP: $($env:TAILSCALE_IP)"
          Write-Host "Port: $($env:RDP_PORT)"
          Write-Host "Username: $($env:RDP_USERNAME)"
          Write-Host "Password: use the TAILSCALE_AUTH_KEY secret value"
          Write-Host ""
          Write-Host "Connect from a device already on the same Tailscale tailnet."
          Write-Host "The secret value will not be displayed here."
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 16. KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep runne
